<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LMS SMKN 1 Banjar Margo</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f8f5,#101812);--panel:light-dark(#fff,#19231c);--text:light-dark(#1d2b22,#edf5ef);--muted:light-dark(#65746a,#a9b9ad);--line:light-dark(#e1e9e2,#2b3b30);--green:light-dark(#187443,#66d28c);--pale:light-dark(#e6f5e9,#203b29);--shadow:0 10px 30px #102b1810}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg)}.top{height:74px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px);gap:22px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;min-width:200px}.logo{width:42px;height:42px;border-radius:13px;background:#187443;color:white;display:grid;place-items:center;font-size:23px}.brand b{display:block;font-size:16px;letter-spacing:-.3px}.brand small{color:var(--muted);font-size:11px}.nav{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 11px;border-radius:10px;font-size:13px}.nav button.active,.nav button:hover{background:var(--pale);color:var(--green);font-weight:700}.login{border:0;background:#187443;color:#fff;padding:11px 17px;border-radius:11px;font-weight:700;white-space:nowrap}.wrap{max-width:1200px;margin:auto;padding:30px 24px 60px}.welcome{display:flex;align-items:center;justify-content:space-between;gap:22px;margin-bottom:26px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px}.welcome h1{font-size:clamp(27px,4vw,40px);line-height:1.12;letter-spacing:-1.5px;margin:8px 0 12px}.welcome p{margin:0;color:var(--muted);max-width:620px}.hero-art{width:190px;height:145px;border-radius:25px;background:linear-gradient(145deg,#d8f4df,#8bd4a1);display:grid;place-items:center;flex-shrink:0;position:relative;overflow:hidden}.hero-art:before,.hero-art:after{content:"";position:absolute;border-radius:50%;background:#ffffff45;width:130px;height:130px;right:-25px;top:-35px}.hero-art:after{width:85px;height:85px;right:auto;top:auto;left:-20px;bottom:-20px}.plant{font-size:70px;z-index:1;filter:drop-shadow(0 7px 4px #246c3b30)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 30px}.stat,.panel,.subject{background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:17px 18px;display:flex;align-items:center;gap:13px}.stat-icon{width:43px;height:43px;border-radius:13px;background:var(--pale);display:grid;place-items:center;font-size:20px}.stat label{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:23px;line-height:1.3}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:25px 0 15px}.section-head h2{font-size:20px;margin:0;letter-spacing:-.4px}.section-head p{color:var(--muted);font-size:13px;margin:4px 0 0}.text-btn{background:transparent;border:0;color:var(--green);font-weight:750}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filters button{background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:8px 14px;color:var(--muted);font-size:12px}.filters button.active{background:var(--pale);color:var(--green);border-color:light-dark(#a8dcb5,#376b47);font-weight:750}.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.subject{padding:19px;display:flex;gap:15px;align-items:flex-start;transition:transform .18s,border-color .18s}.subject:hover{transform:translateY(-2px);border-color:var(--green)}.sub-icon{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:27px;flex-shrink:0}.sub-body{flex:1;min-width:0}.sub-body h3{margin:1px 0 5px;font-size:16px}.sub-body p{margin:0;color:var(--muted);font-size:12px}.tag{display:inline-block;margin-top:9px;border-radius:6px;padding:4px 8px;background:var(--pale);color:var(--green);font-size:11px;font-weight:750}.subject-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px}.mini-progress{height:6px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:8px}.mini-progress span{display:block;height:100%;background:#31a45e;border-radius:10px}.subject-foot small{font-size:11px;color:var(--muted)}.go{border:0;border-radius:10px;background:var(--pale);color:var(--green);padding:9px 12px;font-weight:750;font-size:12px;white-space:nowrap}.lower{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:25px}.panel{padding:20px}.panel h2{font-size:17px;margin:0 0 16px}.path{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.path:last-child{border:0}.path-icon{width:38px;height:38px;border-radius:12px;background:var(--pale);display:grid;place-items:center;font-size:18px}.path b{font-size:13px;display:block}.path small{font-size:11px;color:var(--muted)}.status{margin-left:auto;font-size:10px;padding:5px 8px;border-radius:20px;background:var(--pale);color:var(--green);height:max-content;white-space:nowrap}.profile-card{display:flex;gap:15px;align-items:center}.avatar{width:65px;height:65px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#c7edcf,#3a9d5e);font-size:27px;color:#155b31;font-weight:800}.profile-card h3{margin:0 0 3px;font-size:16px}.profile-card p{margin:0;color:var(--muted);font-size:12px}.profile-detail{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.page-title{margin:0 0 5px;font-size:29px;letter-spacing:-.8px}.page-sub{margin:0 0 24px;color:var(--muted)}.empty{padding:34px;text-align:center;color:var(--muted)}.modal-back{position:fixed;inset:0;background:#07150bcc;display:none;place-items:center;padding:20px;z-index:20}.modal-back.show{display:grid}.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:25px;width:min(460px,100%);box-shadow:0 25px 80px #0004}.modal h2{margin:0 0 6px}.modal p{margin:0 0 18px;color:var(--muted);font-size:13px}.modal label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}.modal input,.modal select{width:100%;padding:12px;border:1px solid var(--line);background:var(--bg);border-radius:10px;color:var(--text)}.modal-actions{display:flex;gap:9px;margin-top:18px}.secondary{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 15px}.notice{font-size:11px;color:var(--muted);margin-top:13px}.lesson-box{background:var(--pale);padding:20px;border-radius:15px;margin:16px 0}.lesson-box h3{margin:0 0 8px}.lesson-box p{color:var(--muted);font-size:13px}.lesson-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.step{padding:12px 6px;border:1px solid var(--line);border-radius:12px;text-align:center;font-size:11px;color:var(--muted)}.step span{display:block;font-size:20px;margin-bottom:5px}.step.current{background:var(--pale);border-color:var(--green);color:var(--green);font-weight:750}footer{text-align:center;color:var(--muted);font-size:11px;padding:20px;border-top:1px solid var(--line)}
@media(max-width:900px){.top{height:auto;min-height:70px;flex-wrap:wrap;padding:13px 18px}.nav{order:3;width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.nav button{white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}.hero-art{width:135px;height:120px}.lower{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:23px 15px 40px}.welcome{align-items:flex-start}.hero-art{display:none}.subjects{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:20px}.section-head{align-items:flex-start}.brand{min-width:0}.login{padding:9px 12px}.lesson-steps{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><div class="app" id="app">
<header class="top"><div class="brand"><div class="logo">🌱</div><div><b>LMS SMK</b><small>SMKN 1 Banjar Margo</small></div></div><nav class="nav" id="nav"><button class="active" data-page="Beranda">Beranda</button><button data-page="Bahan Materi">Bahan Materi</button><button data-page="Kuis">Kuis</button><button data-page="Simulasi">Simulasi</button><button data-page="Latihan Soal">Latihan Soal</button><button data-page="Ujian">Ujian</button><button data-page="Profil">Profil</button></nav><button class="login" id="loginBtn">Masuk / Daftar ↗</button></header>
<main class="wrap" id="content"></main><footer>© 2026 LMS SMKN 1 Banjar Margo · Dikembangkan untuk pembelajaran vokasi</footer></div>
<div class="modal-back" id="modalBack"><div class="modal"><h2 id="modalTitle">Selamat datang!</h2><p id="modalDesc">Masuk untuk melihat progres belajarmu.</p><form id="loginForm"><label for="studentName">Nama lengkap</label><input id="studentName" placeholder="Masukkan nama lengkap" required><label for="studentClass">Kelas</label><select id="studentClass" required><option value="">Pilih kelas</option><option>X ATPH</option><option>XI ATPH</option><option>XII ATPH</option><option>XI KIK</option><option>XII KIK</option><option>X TSM</option><option>XI TSM</option><option>XII TSM</option><option>X TKJ</option><option>XI TKJ</option><option>XII TKJ</option><option>XI MP</option><option>XII MP</option></select><div class="modal-actions"><button class="login" type="submit">Lanjutkan</button><button class="secondary" type="button" id="cancelModal">Batal</button></div></form><div class="notice">Demo antarmuka: login ini hanya menyimpan nama di sesi halaman, belum memakai akun sekolah atau database.</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Konfigurasi koneksi Supabase
const SUPABASE_URL = 'https://qvqzxsmjmihdysegteyx.supabase.co/rest/v1/';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Ho8bhD5i_S4raFM_RcSTXA_ydxCVsyb';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);
const subjects=[
{id:'atph11',name:'Konsentrasi Keahlian ATPH',grade:'Kelas XI',group:'ATPH',desc:'Budidaya tanaman, media tanam, hidroponik, dan fertigasi.',icon:'🌿',color:'#e0f4e5',progress:62,lessons:8},
{id:'atph12',name:'Konsentrasi Keahlian ATPH',grade:'Kelas XII',group:'ATPH',desc:'Pengelolaan produksi, panen, pascapanen, dan usaha tani.',icon:'🍈',color:'#e0f4e5',progress:25,lessons:10},
{id:'kik11',name:'Kreativitas, Inovasi, dan Kewirausahaan',grade:'Kelas XI',group:'KIK',desc:'Kreativitas, growth mindset, eksplorasi ide, dan inovasi.',icon:'💡',color:'#fff0d8',progress:40,lessons:6},
{id:'kik12',name:'Kreativitas, Inovasi, dan Kewirausahaan',grade:'Kelas XII',group:'KIK',desc:'Pengembangan produk, model bisnis, dan pemasaran usaha.',icon:'🚀',color:'#fff0d8',progress:10,lessons:7},
{id:'info10',name:'Informatika',grade:'Kelas X',group:'Informatika',desc:'Berpikir komputasional, algoritma, data, dan pemrograman.',icon:'💻',color:'#e2efff',progress:75,lessons:9},
{id:'tik11',name:'Teknologi Informasi dan Komunikasi',grade:'Kelas XI',group:'TIK',desc:'Pengolahan dokumen, tabel, presentasi, dan produktivitas digital.',icon:'🖥️',color:'#f0e7ff',progress:50,lessons:8}
];
let page='Beranda',filter='Semua',loggedIn=false,student='',studentClass='',selected=null,completed={};
const content=document.getElementById('content');
function subjectCards(){let list=subjects.filter(s=>filter==='Semua'||s.group===filter||s.grade===filter);return list.length?`<div class="subjects">${list.map(s=>`<article class="subject"><div class="sub-icon" style="background:${s.color}">${s.icon}</div><div class="sub-body"><h3>${s.name}</h3><p>${s.grade} · ${s.desc}</p><span class="tag">${s.lessons} modul belajar</span><div class="subject-foot"><div style="flex:1"><small>${loggedIn?'Progres belajar':'Contoh progres'} · ${s.progress}%</small><div class="mini-progress"><span style="width:${s.progress}%"></span></div></div><button class="go" data-open="${s.id}">Buka kelas →</button></div></div></article>`).join('')}</div>`:`<div class="panel empty">Belum ada mata pelajaran pada filter ini.</div>`}
function renderHome(){return `<section class="welcome"><div><div class="eyebrow">Ruang belajar digital</div><h1>${loggedIn?`Halo, ${student.split(' ')[0]}! 👋`:'Belajar, praktik, dan tumbuh bersama.'}</h1><p>Selamat datang di LMS SMKN 1 Banjar Margo. Pilih mata pelajaranmu, ikuti tahapan belajar, dan pantau perkembangan kompetensimu.</p></div><div class="hero-art"><div class="plant">🌱</div></div></section><section class="stats"><div class="stat"><div class="stat-icon">📚</div><div><label>Mata pelajaran</label><strong>6</strong></div></div><div class="stat"><div class="stat-icon">✅</div><div><label>Materi selesai</label><strong>${loggedIn?Object.keys(completed).length:'—'}</strong></div></div><div class="stat"><div class="stat-icon">🎯</div><div><label>Nilai rata-rata</label><strong>${loggedIn?'—':'—'}</strong></div></div><div class="stat"><div class="stat-icon">⏱️</div><div><label>Status belajar</label><strong style="font-size:16px">${loggedIn?'Aktif':'Siap mulai'}</strong></div></div></section><div class="section-head"><div><h2>Pilih mata pelajaran</h2><p>Mulai dari materi yang sedang dipelajari di kelas.</p></div><button class="text-btn" data-page="Bahan Materi">Lihat semua →</button></div><div class="filters">${['Semua','ATPH','KIK','Informatika','TIK'].map(f=>`<button class="${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div>${subjectCards()}<section class="lower"><div class="panel"><h2>🧭 Alur belajar yang disarankan</h2><div class="path"><div class="path-icon">📖</div><div><b>1. Pelajari bahan materi</b><small>Baca modul, amati gambar, atau tonton video pembelajaran.</small></div><span class="status">Mulai di sini</span></div><div class="path"><div class="path-icon">🧠</div><div><b>2. Kerjakan kuis</b><small>Periksa pemahaman awal dan lihat umpan balik.</small></div></div><div class="path"><div class="path-icon">🧪</div><div><b>3. Coba simulasi dan latihan</b><small>Latih keterampilan sebelum penilaian akhir.</small></div></div><div class="path"><div class="path-icon">🏆</div><div><b>4. Ikuti ujian</b><small>Ukur penguasaan materi setelah siap.</small></div></div></div><div class="panel"><h2>👨‍🏫 Pengembang LMS</h2><div class="profile-card"><div class="avatar">S</div><div><h3>Sumarno, S.P.</h3><p>Guru Agribisnis Tanaman</p><p>SMKN 1 Banjar Margo</p></div></div><div class="profile-detail">Platform pembelajaran untuk mendukung murid belajar mandiri, berlatih, dan mengembangkan kompetensi vokasi.</div><button class="go" style="margin-top:14px" data-page="Profil">Lihat profil →</button></div></section>`}
function renderCourseList(title,desc){return `<h1 class="page-title">${title}</h1><p class="page-sub">${desc}</p><div class="filters">${['Semua','ATPH','KIK','Informatika','TIK'].map(f=>`<button class="${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div>${subjectCards()}`}
function renderLesson(s){let steps=[['📖','Materi'],['🧠','Kuis'],['🧪','Simulasi'],['✍️','Latihan'],['🏆','Ujian']];return `<button class="text-btn" data-page="Beranda">← Kembali ke beranda</button><div class="section-head"><div><div class="eyebrow">${s.grade} · ${s.group}</div><h1 class="page-title">${s.name}</h1><p class="page-sub">${s.desc}</p></div></div><div class="panel"><h2>Jalur pembelajaran</h2><div class="lesson-steps">${steps.map((x,i)=>`<div class="step ${i===0?'current':''}"><span>${x[0]}</span>${x[1]}</div>`).join('')}</div><div class="lesson-box"><h3>📘 Modul 1 — Pengenalan materi</h3><p>Materi pembelajaran akan dikelola guru sesuai tujuan pembelajaran, kelas, dan semester. Murid mempelajari isi modul sebelum melanjutkan ke kuis.</p><p><b>Tujuan:</b> memahami konsep dasar dan menghubungkannya dengan situasi nyata di sekolah atau dunia kerja.</p><button class="login" id="completeLesson">Tandai materi selesai ✓</button></div><div class="section-head"><div><h2>Aktivitas berikutnya</h2><p>Fitur ini contoh alur; soal dan simulasi diisi guru saat pengembangan.</p></div></div><div class="subjects"><div class="subject"><div class="sub-icon" style="background:#e2efff">🧠</div><div class="sub-body"><h3>Kuis pemahaman</h3><p>Contoh: 5–10 soal pilihan ganda dengan umpan balik otomatis.</p><button class="go" data-page="Kuis">Lihat kuis →</button></div></div><div class="subject"><div class="sub-icon" style="background:#fff0d8">🧪</div><div class="sub-body"><h3>Simulasi / latihan</h3><p>Aktivitas praktik sesuai materi yang tersedia.</p><button class="go" data-page="Simulasi">Lihat simulasi →</button></div></div></div></div>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(selected){const s=subjects.find(x=>x.id===selected);content.innerHTML=renderLesson(s)}else if(page==='Beranda')content.innerHTML=renderHome();else if(page==='Bahan Materi')content.innerHTML=renderCourseList(page,'Pilih kelas untuk melihat modul, teks, video, presentasi, dan bahan bacaan.');else if(['Kuis','Simulasi','Latihan Soal','Ujian'].includes(page))content.innerHTML=`<h1 class="page-title">${page}</h1><p class="page-sub">Pilih mata pelajaran untuk melihat aktivitas ${page.toLowerCase()} yang disiapkan guru.</p>${renderCourseList('',page==='Ujian'?'Ujian digunakan untuk mengukur pemahaman setelah materi, kuis, dan latihan diselesaikan.':'Aktivitas akan ditampilkan berdasarkan mata pelajaran dan materi yang dipilih.').replace('<h1 class="page-title"></h1><p class="page-sub"></p>','')}`;else if(page==='Profil')content.innerHTML=`<h1 class="page-title">Profil Pengembang</h1><p class="page-sub">Informasi pengembang dan tujuan platform pembelajaran.</p><div class="panel"><div class="profile-card"><div class="avatar" style="width:86px;height:86px;font-size:35px">S</div><div><h2 style="margin:0 0 5px">Sumarno, S.P.</h2><p style="color:var(--muted);margin:0">Guru Agribisnis Tanaman SMKN 1 Banjar Margo</p><span class="tag">Pengembang LMS</span></div></div><div class="profile-detail" style="font-size:14px;line-height:1.8">LMS ini dirancang sebagai ruang belajar digital yang membantu murid mempelajari materi secara bertahap, mengerjakan kuis dan latihan, mencoba simulasi, serta mengikuti ujian. Guru dapat mengembangkan konten sesuai mata pelajaran dan kebutuhan pembelajaran vokasi.</div><h3>Mata pelajaran yang didukung</h3><ul><li>Konsentrasi Keahlian ATPH — kelas XI dan XII</li><li>Kreativitas, Inovasi, dan Kewirausahaan — kelas XI dan XII</li><li>Informatika — kelas X</li><li>TIK — kelas XI</li></ul></div>`;}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;selected=null;render();window.scrollTo({top:0,behavior:'smooth'})}let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render()}let o=e.target.closest('[data-open]');if(o){selected=o.dataset.open;render();window.scrollTo({top:0,behavior:'smooth'})}if(e.target.id==='completeLesson'){completed[selected]=true;alert('Materi ditandai selesai pada demo ini. Pada LMS produksi, progres akan disimpan ke database.');render()}});
document.getElementById('loginBtn').onclick=()=>document.getElementById('modalBack').classList.add('show');document.getElementById('cancelModal').onclick=()=>document.getElementById('modalBack').classList.remove('show');document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')e.currentTarget.classList.remove('show')};document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();student=document.getElementById('studentName').value.trim();studentClass=document.getElementById('studentClass').value;loggedIn=true;document.getElementById('loginBtn').textContent='👤 '+student.split(' ')[0];document.getElementById('modalBack').classList.remove('show');render()};render();
</script></body></html>
